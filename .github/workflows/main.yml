# Название автоматического процесса
name: Unity 2D Platformer CI/CD

# Запуск при отправке изменений в main
on:
  push:
    branches: ["main"]

jobs:
  # ЗАДАЧА 1: Проверка структуры проекта
  sanity_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Unity Directories
        run: |
          echo "=== Проверка наличия метаданных Unity ==="
          if [ -d "ProjectSettings" ]; then
            echo "ProjectSettings найден."
          else
            echo "Ошибка: ProjectSettings не найден!"
            exit 1
          fi
          if [ -d "Packages" ]; then
            echo "Packages найден."
          else
            echo "Ошибка: Packages не найден!"
            exit 1
          fi

      - name: Locate 2D Platformer Scripts
        run: |
          echo "=== Поиск C# скриптов в папке Assets ==="
          find Assets/ -name "*Controller.cs" -print
          find Assets/ -name "BuildManager.cs" -print

  # ЗАДАЧА 2 (ЛР №4): Автоматический запуск тестов Unity (EditMode + PlayMode)
  run_tests:
    needs: sanity_check # Тесты запускаются сразу после проверки структуры проекта
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # Поддержка Git LFS, если в игре есть тяжелая графика

      # Кэш папки Library, чтобы повторные прогоны тестов были быстрее
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      # Официальный CLI GameCI с фиксированной версией
      - name: Install GameCI CLI
        run: |
          curl -sL -o game-ci.tar.gz https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz
          tar xzf game-ci.tar.gz ./game-ci
          echo "$PWD" >> $GITHUB_PATH

      # Запуск тестов EditMode и PlayMode в контейнере unityci/editor.
      # CLI вызывается напрямую (а не через game-ci/unity-test-runner@v4), т.к. экшен
      # формирует флаг --no-coverageEnabled, которого CLI v0.1.72 не понимает.
      # Coverage отключен: инструментирование кода роняет Unity 6 в контейнере (SIGSEGV, 139).
      # Версия Unity указывается явно: ProjectVersion.txt исключен .gitignore.
      - name: Run Unity Tests
        run: |
          game-ci test --docker --dockerShmSize=1025m \
            --engine=unity --testPlatforms='playmode;editmode;COMBINE_RESULTS' \
            --engineVersion=6000.5.10f1 --coverageEnabled=false \
            --artifactsPath=artifacts --dockerIsolationMode=default \
            --containerRegistryRepository=unityci/editor \
            --containerRegistryImageVersion=3
        env:
          # Секреты лицензии Unity для активации редактора на раннере
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # Выводим результат каждого теста на страницу запуска (аннотации + Summary)
      - name: Test results summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          rows = []
          for f in glob.glob("artifacts/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("test-case"):
                  rows.append((tc.get("result"), tc.get("fullname"), tc.get("duration")))
          passed = sum(r[0] == "Passed" for r in rows)
          print(f"::notice title=Unity tests::{passed}/{len(rows)} passed")
          for res, name, dur in rows:
              level = "notice" if res == "Passed" else "error"
              print(f"::{level} title={res}::{name} ({float(dur or 0):.2f}s)")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(f"### Unity tests: {passed}/{len(rows)} passed\n\n| Result | Test | Time, s |\n|---|---|---|\n")
              for res, name, dur in rows:
                  s.write(f"| {'✅' if res == 'Passed' else '❌'} {res} | `{name}` | {float(dur or 0):.2f} |\n")
          PY

      # Сохраняем результаты и логи тестов артефактами (даже при падении)
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/

  # ЗАДАЧА 3 (ЛР №5): Настоящая компиляция WebGL-игры в облаке
  build_game:
    needs: run_tests # Запустится только если тесты из ЛР №4 прошли успешно
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # В игре могут быть тяжелые бинарные ассеты

      # Кэшируем Library, чтобы повторная компиляция шла минуты, а не полчаса
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Build-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      # Облачный компилятор Unity 6 от GameCI (контейнер unityci/editor)
      - name: Build WebGL Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          # Вызов C# метода автоматизации из Лабораторной работы №1
          buildMethod: BuildManager.BuildWebGL
          # Версия Unity указывается явно: ProjectVersion.txt в .gitignore
          unityVersion: 6000.5.10f1

      # Выводим состав билда в лог и в аннотацию прогона
      - name: Show build contents
        run: |
          sudo chown -R "$(id -u)" Builds || true
          echo "=== Содержимое Builds/WebGL ==="
          ls -la Builds/WebGL Builds/WebGL/Build
          SIZE=$(du -sh Builds/WebGL | cut -f1)
          FILES=$(ls Builds/WebGL/Build | tr '\n' ' ')
          echo "::notice title=WebGL build (${SIZE})::${FILES}"

      # Сохраняем НАСТОЯЩИЕ скомпилированные файлы во временное облачное хранилище
      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

  # ЗАДАЧА 4: Копирование в резервный репозиторий
  mirror_repo:
    needs: run_tests # Зеркалирование начнется только после успешных тестов
    if: github.repository == 'medrss/platformer-microgame-labs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify token is set
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "Ошибка: BACKUP_TOKEN не задан!"
            exit 1
          else
            echo "BACKUP_TOKEN задан."
          fi

      - name: Push to Backup Repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          echo "=== Начало процесса зеркалирования ==="
          git push --force "https://x-access-token:${BACKUP_TOKEN}@github.com/medrss/2d_platformer_backup.git" main
          echo "=== Код успешно продублирован ==="

  # ЗАДАЧА 5 (ЛР №3, ЛР №5): Docker-образ с НАСТОЯЩЕЙ игрой и публикация в GHCR
  build_docker_image:
    needs: build_game # Ждем полноценного билда игры
    runs-on: ubuntu-latest

    # Разрешаем этой задаче публиковать пакеты в GitHub Packages
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Вместо генерации заглушек (touch) скачиваем живой билд из задачи build_game
      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Системный автоматический токен GitHub

      - name: Build and Push Compressed Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/medrss/platformer-game:latest
            ghcr.io/medrss/platformer-game:${{ github.sha }}

  # ЗАДАЧА 6 (ЛР №5): Автоматический деплой игры на GitHub Pages
  deploy_to_pages:
    needs: build_game # Деплоим только успешно собранную игру
    runs-on: ubuntu-latest

    # Публикация в ветку gh-pages требует прав на запись содержимого репозитория
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      # Публикуем папку Builds/WebGL в служебную ветку gh-pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Builds/WebGL
          branch: gh-pages # Ветка для хостинга страниц

  # ЗАДАЧА 7 (ЛР №6): Telegram-оповещения о результатах пайплайна
  notify:
    needs: [sanity_check, run_tests, build_game, build_docker_image, deploy_to_pages]
    if: always() # Аналог after_script: задача выполняется при любом исходе остальных
    runs-on: ubuntu-latest
    steps:
      - name: Determine pipeline status
        id: status
        run: |
          if [ "${{ needs.sanity_check.result }}" != "success" ]; then echo "stage=sanity_check" >> $GITHUB_OUTPUT
          elif [ "${{ needs.run_tests.result }}" != "success" ]; then echo "stage=run_tests" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build_game.result }}" != "success" ]; then echo "stage=build_game" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build_docker_image.result }}" != "success" ]; then echo "stage=build_docker_image" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy_to_pages.result }}" != "success" ]; then echo "stage=deploy_to_pages" >> $GITHUB_OUTPUT
          else echo "stage=none" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STAGE: ${{ steps.status.outputs.stage }}
          SITE_URL: "https://medrss.github.io/platformer-microgame-labs/"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          if [ "$STAGE" = "none" ]; then
            TEXT=$(printf '✅ Сборка platformer-microgame-labs завершена успешно.\nАвтор коммита: %s\nИгра доступна: %s\nПрогон: %s' "$AUTHOR" "$SITE_URL" "$RUN_URL")
          else
            TEXT=$(printf '❌ Сборка platformer-microgame-labs упала на задаче %s.\nАвтор коммита: %s\nЛог прогона: %s' "$STAGE" "$AUTHOR" "$RUN_URL")
          fi
          # JSON собирается через jq, чтобы переносы строк и кавычки экранировались корректно
          PAYLOAD=$(jq -n --arg chat_id "$CHAT_ID" --arg text "$TEXT" '{chat_id: $chat_id, text: $text}')
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          if echo "$RESPONSE" | jq -e '.ok' > /dev/null; then
            echo "::notice title=Telegram: сообщение отправлено::stage=${STAGE}"
          else
            echo "::error title=Telegram: ошибка отправки::$(echo "$RESPONSE" | jq -r '.description')"
            exit 1
          fi
